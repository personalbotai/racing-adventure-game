<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Adventure 3D</title>
  <script type="module" crossorigin src="/racing-adventure-game/assets/index-DhGAiEg9.js"></script>
  <link rel="stylesheet" crossorigin href="/racing-adventure-game/assets/index-C55py4Hh.css">
</head>
<body>
    <div id="game-container"></div>
    
    <div id="ui-overlay">
        <div id="start-screen">
            <h1>🏎️ MANDALIKA RACING</h1>
            <p>Gunakan <strong>WASD</strong> atau <strong>Arrow Keys</strong> untuk mengendarai mobil<br>
               Selesaikan <strong>10 putaran</strong> dan kumpulkan koin emas!</p>
            <button id="start-btn">MULAI BALAP</button>
        </div>
        
        <div id="game-ui" class="hidden">
            <div id="score-display">🏆 SKOR: 0</div>
            <div id="time-display">⏱️ WAKTU: 0s</div>
        </div>

        <div id="controls-hint" class="hidden">
            W A S D / ↑ ↓ ← →
        </div>
        
        <div id="game-over" class="hidden">
            <h1>🎉 SELESAI!</h1>
            <p id="final-score">Skor Akhir: 0 | Waktu: 0s</p>
            <button id="restart-btn">MAIN LAGI</button>
        </div>
    </div>
    
</body>
</html>
